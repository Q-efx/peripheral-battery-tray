# Builds the Windows executables and the installer (installer.yml) and publishes
# them as GitHub releases:
#   - push to main  -> rolling "latest" pre-release, replaced on every push
#   - push tag v*   -> versioned release (tags with a "-", e.g. v1.2.0-rc1, become pre-releases)
#   - pull request  -> build and test only
name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# One run per ref at a time. Release runs queue instead of being cancelled
# halfway through replacing a release; superseded PR runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Third-party actions are pinned to commit SHAs (version in the comment).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # Versioned releases build from scratch, never from a cache another ref wrote.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.ref_type != 'tag'

      - name: Read Cargo.toml version
        id: version
        shell: bash
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" >> "$GITHUB_OUTPUT"

      - name: Check tag matches Cargo.toml version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          CRATE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "${GITHUB_REF_NAME#v}" != "$CRATE_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CRATE_VERSION"
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      # The executables are released as-is (no zip) so they can be downloaded
      # directly. The release jobs add one checksum file covering every .exe.
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            target/release/battery-tray.exe
            target/release/battery-cli.exe
          if-no-files-found: error

  installer:
    name: Installer
    needs: build
    uses: ./.github/workflows/installer.yml
    with:
      version: ${{ needs.build.outputs.version }}

  release-latest:
    name: Release "latest"
    needs: [build, installer]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-x64*
          merge-multiple: true
          path: dist

      - name: Write checksums
        working-directory: dist
        run: sha256sum -- *.exe > SHA256SUMS.txt

      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          # A leftover tag would make the new release point at the old commit.
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/latest" 2>/dev/null || true
          gh release create latest dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build (main)" \
            --notes "Rolling build of \`main\` at ${GITHUB_SHA::7}, built $(date -u '+%Y-%m-%d %H:%M UTC').

          This release is replaced on every push to \`main\`. For a stable build, pick a versioned release."

  release-version:
    name: Release ${{ github.ref_name }}
    needs: [build, installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-x64*
          merge-multiple: true
          path: dist

      - name: Write checksums
        working-directory: dist
        run: sha256sum -- *.exe > SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Re-run of an existing release: refresh its files.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            exit 0
          fi
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${flags[@]}"
